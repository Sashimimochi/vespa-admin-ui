name: テスト

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: テスト実行
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール
        run: npm ci

      - name: テストの実行
        run: npm run test:ci
